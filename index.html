      const cards = filtered.map(item => {
        const kind = item.type === 'lab' ? '工作坊' : (item.title === 'Welcome opening' ? '開場' : (item.room === 'ABCDEF 會議室' ? '主題演講' : '分堂議程'));
        const path = item.type === 'lab' ? 'lab' : 'session';
        const startRow = rowAt(item.start);
        const durationRows = Math.max(1, Math.round((toMinutes(item.end) - toMinutes(item.start)) / 5));
        const column = rooms.indexOf(item.room) + 2;
        return `<a class="card ${item.type}" style="grid-column:${column};grid-row:${startRow}/span ${durationRows}" href="https://hwdc.ithome.com.tw/2026/${path}/${item.id}" target="_blank" rel="noopener"><div class="meta"><span>${item.start}–${item.end}</span><span>${kind}</span></div><div class="title">${escapeHtml(item.title)}</div>${item.speaker ? `<div class="speaker">${escapeHtml(item.speaker)}</div>` : ''}</a>`;
      }).join('');
      document.querySelector('#schedule').innerHTML = lanes + marks.join('') + cards;
      document.querySelector('#notice').style.display = filtered.length ? 'none' : 'block';
    }
    document.querySelectorAll('[data-date]').forEach(button => button.addEventListener('click', () => {
      selectedDate = button.dataset.date;
      document.querySelectorAll('[data-date]').forEach(x => x.classList.toggle('active', x === button));
      render();
    }));
    document.querySelector('#search').addEventListener('input', render);
    render();
  </script>
</body>
</html>
